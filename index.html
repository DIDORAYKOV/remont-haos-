<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<meta name="theme-color" content="#0a0a0a"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<title>Ремонт Хаос — Тефтер</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:#0a0a0a;color:#fff;font-family:'Segoe UI',system-ui,sans-serif;min-height:100dvh;overscroll-behavior:none}
input,select,textarea,button{font-family:inherit}
input,select,textarea{background:#0f0f0f;border:1.5px solid #2a2a2a;border-radius:10px;color:#fff;font-size:14px;outline:none;padding:11px 14px;width:100%}
input::placeholder,textarea::placeholder{color:#444}
select option{background:#1a1a1a}
textarea{resize:vertical;min-height:60px}
button{cursor:pointer}
::-webkit-scrollbar{width:3px}::-webkit-scrollbar-thumb{background:#2a2a2a;border-radius:2px}
.screen{display:none;flex-direction:column;min-height:100dvh}
.screen.active{display:flex}
.topbar{background:#0f0f0f;border-bottom:1px solid #1e1e1e;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;flex-shrink:0}
.bottomnav{background:#0f0f0f;border-top:1px solid #1e1e1e;padding:10px 16px;display:flex;justify-content:space-around;align-items:center;flex-shrink:0;position:sticky;bottom:0}
.scrollarea{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.pad{padding:14px 16px 20px}
.card{background:#161616;border:1px solid #222;border-radius:14px;padding:16px;margin-bottom:10px;cursor:pointer;transition:transform 0.1s}
.card:active{transform:scale(0.98)}
.pill{font-size:11px;font-weight:600;padding:4px 10px;border-radius:20px;white-space:nowrap}
.lbl{font-size:11px;color:#666;letter-spacing:.1em;text-transform:uppercase;margin-bottom:4px;margin-top:12px;display:block}
.lbl:first-child{margin-top:0}
.infogrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.infobox{background:#161616;border:1px solid #222;border-radius:10px;padding:10px 12px}
.iblabel{font-size:10px;color:#555;margin-bottom:3px}
.ibval{font-size:13px;color:#ccc;font-weight:600}
.matrow{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid #1e1e1e;cursor:pointer}
.matrow:last-child{border-bottom:none}
.chk{width:22px;height:22px;border-radius:6px;border:2px solid #333;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .15s}
.chk.on{background:#10b981;border-color:#10b981}
.navbtn{background:none;border:none;color:#555;display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 16px;font-size:10px;font-weight:600}
.navbtn.active{color:#d4a017}
.fab{background:#d4a017;border:none;border-radius:50%;width:50px;height:50px;display:flex;align-items:center;justify-content:center;box-shadow:0 0 20px #d4a01744;font-size:28px;color:#000;font-weight:300;line-height:1}
.filterpill{padding:6px 12px;border-radius:20px;font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap;flex-shrink:0;border:1px solid #2a2a2a;background:transparent;color:#666}
.filterpill.active{border-color:#d4a017;background:#1a1500;color:#d4a017}
.scrollrow{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.scrollrow::-webkit-scrollbar{display:none}
.back-btn{background:none;border:none;color:#fff;padding:4px;display:flex;align-items:center;gap:8px;font-size:15px;font-weight:700}
.stitle{font-size:13px;color:#fff;font-weight:600;display:flex;align-items:center;gap:6px;margin-bottom:10px}
.outbtn{background:none;border:1px solid #333;border-radius:8px;color:#d4a017;font-size:12px;padding:4px 10px}
.bigbtn{width:100%;padding:14px;border:none;border-radius:12px;font-size:15px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:10px}
.pricebox{background:#1a1500;border:1px solid #3a2e00;border-radius:12px;padding:14px 16px;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center}
.spbox{background:#16100a;border:1px solid #3a2000;border-radius:12px;padding:14px;margin-bottom:12px}
.warnbox{background:#1c1400;border:1px solid #f59e0b44;border-radius:12px;padding:12px 14px;margin-bottom:14px;display:flex;align-items:center;gap:10px;font-size:13px;color:#f59e0b}
.dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
/* Photos */
.pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:14px}
.pthumb{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;cursor:pointer;display:block}
.padd{width:100%;aspect-ratio:1;border-radius:8px;border:1.5px dashed #333;background:#161616;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;color:#555;font-size:11px;gap:4px}
/* Calculator */
.calcsec{background:#161616;border:1px solid #222;border-radius:12px;margin-bottom:12px;overflow:hidden}
.calchdr{padding:12px 14px;border-bottom:1px solid #222;display:flex;justify-content:space-between;align-items:center;cursor:pointer}
.calcrow{display:grid;grid-template-columns:1fr 70px 80px;gap:6px;padding:8px 14px;border-bottom:1px solid #1a1a1a;align-items:center;font-size:13px}
.calcrow:last-child{border-bottom:none}
.calcrow input{padding:6px 8px;font-size:13px;background:#0f0f0f}
.calctotal{padding:12px 14px;background:#1a1500;border-top:1px solid #2a2000;display:flex;justify-content:space-between;align-items:center;font-size:14px}
/* Overlay */
.overlay{position:fixed;inset:0;background:#000;z-index:999;display:flex;align-items:center;justify-content:center}
.oclose{position:absolute;top:16px;right:16px;background:#333;border:none;color:#fff;width:36px;height:36px;border-radius:50%;font-size:18px}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.fade{animation:fadeIn .2s ease}
.empty{text-align:center;color:#555;padding:40px 0;font-size:14px}
.statcard{background:#161616;border:1px solid #222;border-radius:12px;padding:14px}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="screen-login" class="screen active" style="align-items:center;justify-content:center;padding:24px;background:#0f0f0f">
  <div style="text-align:center;margin-bottom:32px">
    <div style="font-size:12px;letter-spacing:.2em;color:#666;text-transform:uppercase;margin-bottom:8px">Ремонт Хаос</div>
    <div style="font-size:28px;font-weight:700;letter-spacing:-.5px">Работен тефтер</div>
    <div style="font-size:13px;color:#555;margin-top:6px">Изберете екип и въведете парола</div>
  </div>
  <div style="width:100%;max-width:340px">
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px" id="team-grid"></div>
    <div id="pw-block" style="display:none" class="fade">
      <input type="password" id="pw-input" placeholder="Парола" style="margin-bottom:8px" onkeydown="if(event.key==='Enter')doLogin()"/>
      <div id="pw-err" style="color:#fc8181;font-size:12px;text-align:center;margin-bottom:8px;display:none">Грешна парола</div>
      <button onclick="doLogin()" style="width:100%;padding:14px;background:#d4a017;border:none;border-radius:10px;color:#000;font-size:15px;font-weight:700">Влез →</button>
    </div>
  </div>
</div>

<!-- MAIN -->
<div id="screen-main" class="screen">
  <div class="topbar">
    <div>
      <div style="font-size:11px;color:#555;letter-spacing:.15em;text-transform:uppercase">Ремонт Хаос</div>
      <div style="font-size:16px;font-weight:700" id="main-uname"></div>
    </div>
    <button onclick="doLogout()" style="background:none;border:1px solid #2a2a2a;border-radius:8px;color:#666;padding:6px 10px;font-size:12px">⎋ Изход</button>
  </div>
  <div class="scrollarea">
    <div id="tab-projects" class="pad">
      <div class="scrollrow" id="filter-row" style="margin-bottom:14px"></div>
      <div id="project-list"></div>
    </div>
    <div id="tab-stats" class="pad" style="display:none"></div>
  </div>
  <div class="bottomnav" id="bottomnav"></div>
</div>

<!-- NEW/EDIT PROJECT -->
<div id="screen-new" class="screen">
  <div class="topbar">
    <button class="back-btn" onclick="showMain()">← <span id="new-screen-title">Нов обект</span></button>
  </div>
  <div class="scrollarea pad" style="padding-bottom:90px" id="new-form"></div>
  <div style="position:sticky;bottom:0;padding:12px 16px;background:#0a0a0a;border-top:1px solid #1e1e1e">
    <button onclick="saveProject()" class="bigbtn" style="background:#d4a017;color:#000;margin:0">💾 Запази обекта</button>
  </div>
</div>

<!-- DETAIL -->
<div id="screen-detail" class="screen">
  <div class="topbar" id="dtopbar"></div>
  <div class="scrollrow" id="dstatus" style="padding:10px 16px 6px;background:#0f0f0f;border-bottom:1px solid #1e1e1e;flex-shrink:0"></div>
  <div class="scrollarea pad" style="padding-bottom:30px" id="dbody"></div>
</div>

<!-- PHOTO OVERLAY -->
<div id="povl" class="overlay" style="display:none">
  <button class="oclose" onclick="document.getElementById('povl').style.display='none'">✕</button>
  <img id="povl-img" src="" style="max-width:100%;max-height:100%;object-fit:contain"/>
</div>

<input type="file" id="photo-input" accept="image/*" multiple style="display:none" onchange="handlePhotos(this)"/>

<script>
// ── Config ────────────────────────────────────────────────────────
const TEAMS=[
  {id:'boss',  name:'Шеф',    password:'boss123',role:'boss'},
  {id:'ekip1', name:'Екип 1', password:'ekip1',  role:'team'},
  {id:'ekip2', name:'Екип 2', password:'ekip2',  role:'team'},
  {id:'ekip3', name:'Екип 3', password:'ekip3',  role:'team'},
];
const STATUS={
  pregled:  {label:'Оглед',    color:'#6366f1'},
  oferта:   {label:'Оферта',   color:'#f59e0b'},
  odobrena: {label:'Одобрена', color:'#10b981'},
  v_rabota: {label:'В работа', color:'#3b82f6'},
  zavarshen:{label:'Завършен', color:'#8b5cf6'},
  platen:   {label:'Платен',   color:'#059669'},
};
const CALC_CATS=[
  {id:'boya',name:'Боядисване',open:false,items:[
    {name:'Подготовка на стени',unit:'м²',price:4},
    {name:'Грунд',unit:'м²',price:2},
    {name:'Боядисване 2 пласта',unit:'м²',price:6},
    {name:'Боядисване таван',unit:'м²',price:7},
  ]},
  {id:'ploch',name:'Плочки / теракот',open:false,items:[
    {name:'Демонтаж плочки',unit:'м²',price:8},
    {name:'Полагане теракот',unit:'м²',price:18},
    {name:'Полагане фаянс',unit:'м²',price:22},
    {name:'Фугиране',unit:'м²',price:4},
  ]},
  {id:'pod',name:'Подови настилки',open:false,items:[
    {name:'Демонтаж настилка',unit:'м²',price:6},
    {name:'Ламинат',unit:'м²',price:14},
    {name:'Паркет',unit:'м²',price:20},
    {name:'Изравняване',unit:'м²',price:8},
  ]},
  {id:'vik',name:'ВиК',open:false,items:[
    {name:'Смяна смесител',unit:'бр',price:40},
    {name:'Смяна тоалетна',unit:'бр',price:80},
    {name:'Смяна мивка',unit:'бр',price:60},
    {name:'Тръбопровод',unit:'м',price:25},
  ]},
  {id:'el',name:'Електро',open:false,items:[
    {name:'Контакт / ключ',unit:'бр',price:15},
    {name:'Полагане кабел',unit:'м',price:8},
    {name:'Осветително тяло',unit:'бр',price:35},
  ]},
  {id:'drugo',name:'Допълнителни',open:false,items:[
    {name:'Транспорт и извозване',unit:'бр',price:60},
    {name:'Чистене след ремонт',unit:'м²',price:3},
  ]},
];

const STORE='rh_v3';
let DB={projects:[]};
let USER=null,FILTER='all',CUR=null;
let NM=[],NP=[],CALC={},EDIT_ID=null;

function load(){try{const r=localStorage.getItem(STORE);if(r)DB=JSON.parse(r);}catch(e){}}
function save(){try{localStorage.setItem(STORE,JSON.stringify(DB));}catch(e){}}
function uid(){return 'p'+Date.now()+Math.random().toString(36).slice(2,6)}

const DEMO=[
  {id:'p1',teamId:'ekip1',client:'Иван Петров',phone:'0888 123 456',address:'ул. Роза 12, Русе',dateVisit:'2026-03-18',deadline:'2026-04-10',status:'v_rabota',price:2450,task:'Ремонт баня — смяна на теракот, боядисване',materials:[{name:'Теракот 60x60 бял',qty:'22 м²',done:true},{name:'Лепило за плочки',qty:'3 торби',done:false},{name:'Боя за стени',qty:'10 л',done:false}],notes:'Запазване на стария санитарен фаянс.',approved:true,photos:[],calcItems:[]},
  {id:'p2',teamId:'ekip2',client:'Мария Иванова',phone:'0877 654 321',address:'бул. Цар Освободител 44, Русе',dateVisit:'2026-03-20',deadline:'2026-04-25',status:'oferта',price:1800,task:'Боядисване — 3 стаи',materials:[{name:'Интериорна боя бяла',qty:'25 л',done:false}],notes:'',approved:false,photos:[],calcItems:[]},
];
load();
if(!DB.projects||DB.projects.length===0){DB.projects=DEMO;save();}

// ── Screens ───────────────────────────────────────────────────────
function showScreen(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById('screen-'+id).classList.add('active');
  window.scrollTo(0,0);
}
function showMain(){EDIT_ID=null;showScreen('main');renderProjectList();}

// ── Login ─────────────────────────────────────────────────────────
let selTeam=null;
function renderLogin(){
  document.getElementById('team-grid').innerHTML=TEAMS.map(t=>`
    <button id="tb-${t.id}" onclick="selectTeam('${t.id}')" style="padding:14px 10px;border-radius:12px;border:1.5px solid #2a2a2a;background:#161616;color:#888;font-size:13px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:6px">
      ${t.role==='boss'?'★':''} ${t.name}</button>`).join('');
}
function selectTeam(id){
  selTeam=id;
  document.querySelectorAll('#team-grid button').forEach(b=>{b.style.border='1.5px solid #2a2a2a';b.style.background='#161616';b.style.color='#888';});
  const b=document.getElementById('tb-'+id);
  b.style.border='2px solid #d4a017';b.style.background='#1a1500';b.style.color='#d4a017';
  document.getElementById('pw-block').style.display='block';
  setTimeout(()=>document.getElementById('pw-input').focus(),100);
}
function doLogin(){
  const team=TEAMS.find(t=>t.id===selTeam);
  const pw=document.getElementById('pw-input').value;
  if(!team)return;
  if(team.password===pw){
    document.getElementById('pw-err').style.display='none';
    USER=team;document.getElementById('pw-input').value='';
    renderMain();showScreen('main');
  } else document.getElementById('pw-err').style.display='block';
}
function doLogout(){
  USER=null;selTeam=null;FILTER='all';
  document.getElementById('pw-block').style.display='none';
  document.getElementById('pw-input').value='';
  document.querySelectorAll('#team-grid button').forEach(b=>{b.style.border='1.5px solid #2a2a2a';b.style.background='#161616';b.style.color='#888';});
  showScreen('login');
}

// ── Main ──────────────────────────────────────────────────────────
function renderMain(){
  document.getElementById('main-uname').textContent=USER.name;
  renderBottomNav();renderFilterRow();renderProjectList();
}
function renderBottomNav(){
  const boss=USER.role==='boss';
  document.getElementById('bottomnav').innerHTML=`
    <button class="navbtn active" id="nav-projects" onclick="switchTab('projects')">📋<br>Обекти</button>
    <button class="fab" onclick="showNewProject()">+</button>
    ${boss?`<button class="navbtn" id="nav-stats" onclick="switchTab('stats')">📊<br>Статистики</button>`
          :`<button class="navbtn" style="color:#555">👤<br>Профил</button>`}`;
}
function switchTab(t){
  document.getElementById('tab-projects').style.display=t==='projects'?'block':'none';
  document.getElementById('tab-stats').style.display=t==='stats'?'block':'none';
  ['projects','stats'].forEach(x=>{const b=document.getElementById('nav-'+x);if(b)b.className='navbtn'+(t===x?' active':'');});
  if(t==='stats')renderStats();
}
function renderFilterRow(){
  const filters=[{k:'all',l:'Всички'},...Object.entries(STATUS).map(([k,v])=>({k,l:v.label}))];
  document.getElementById('filter-row').innerHTML=filters.map(f=>`
    <button class="filterpill${f.k===FILTER?' active':''}" onclick="setFilter('${f.k}')">${f.l}</button>`).join('');
}
function setFilter(f){FILTER=f;renderFilterRow();renderProjectList();}
function myProjects(){return USER.role==='boss'?DB.projects:DB.projects.filter(p=>p.teamId===USER.id);}
function renderProjectList(){
  const ps=FILTER==='all'?myProjects():myProjects().filter(p=>p.status===FILTER);
  const el=document.getElementById('project-list');
  if(!ps.length){el.innerHTML='<div class="empty">Няма обекти</div>';return;}
  el.innerHTML=ps.map(p=>{
    const st=STATUS[p.status]||STATUS.pregled;
    const team=TEAMS.find(t=>t.id===p.teamId);
    const photoCount=p.photos?p.photos.length:0;
    return `<div class="card" onclick="openProject('${p.id}')">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px">
        <div><div style="font-weight:700;font-size:15px;margin-bottom:2px">${p.client}</div>
        <div style="font-size:12px;color:#555">${p.address.split(',')[0]}</div></div>
        <span class="pill" style="background:${st.color}22;color:${st.color};border:1px solid ${st.color}44">${st.label}</span>
      </div>
      <div style="font-size:12px;color:#666;margin-bottom:10px;line-height:1.4;border-left:2px solid #2a2a2a;padding-left:8px">${p.task}</div>
      <div style="display:flex;justify-content:space-between;align-items:center">
        <div style="font-size:12px;color:#555">📅 ${p.deadline||'—'}${photoCount>0?` · 📷 ${photoCount}`:''}</div>
        <div style="display:flex;align-items:center;gap:8px">
          ${USER.role==='boss'?`<span style="font-size:11px;color:#888;background:#1e1e1e;padding:2px 8px;border-radius:8px">${team?.name||''}</span>`:''}
          <span style="font-weight:700;color:#d4a017;font-size:15px">${Number(p.price).toLocaleString()} лв</span>
        </div>
      </div>
      ${!p.approved?'<div style="margin-top:8px;font-size:11px;color:#f59e0b">● Чака одобрение</div>':''}
    </div>`;
  }).join('');
}

// ── Detail ────────────────────────────────────────────────────────
function openProject(id){
  CUR=DB.projects.find(p=>p.id===id);
  if(!CUR)return;
  renderDetail();showScreen('detail');
}
function renderDetail(){
  const p=CUR;
  const st=STATUS[p.status]||STATUS.pregled;
  const team=TEAMS.find(t=>t.id===p.teamId);
  const isBoss=USER.role==='boss';
  const doneMats=(p.materials||[]).filter(m=>m.done).length;
  const photos=p.photos||[];

  document.getElementById('dtopbar').innerHTML=`
    <button class="back-btn" onclick="showMain()">← ${p.client}</button>
    <div style="display:flex;gap:8px;align-items:center">
      <button onclick="editProject('${p.id}')" style="background:none;border:1px solid #2a2a2a;border-radius:8px;color:#888;padding:6px 8px;font-size:12px">✏️ Редакция</button>
      <span class="pill" style="background:${st.color}22;color:${st.color};border:1px solid ${st.color}44">${st.label}</span>
    </div>`;

  document.getElementById('dstatus').innerHTML=Object.entries(STATUS).map(([k,v])=>`
    <button onclick="changeStatus('${k}')" style="padding:5px 10px;border-radius:8px;font-size:11px;font-weight:600;cursor:pointer;white-space:nowrap;flex-shrink:0;border:1px solid ${p.status===k?v.color:'#2a2a2a'};background:${p.status===k?v.color+'22':'transparent'};color:${p.status===k?v.color:'#555'}">
      ${v.label}</button>`).join('');

  document.getElementById('dbody').innerHTML=`
    <div class="infogrid">
      <div class="infobox"><div class="iblabel">Телефон</div><div class="ibval">${p.phone||'—'}</div></div>
      <div class="infobox"><div class="iblabel">Дата оглед</div><div class="ibval">${p.dateVisit||'—'}</div></div>
      <div class="infobox"><div class="iblabel">Краен срок</div><div class="ibval">${p.deadline||'—'}</div></div>
      <div class="infobox"><div class="iblabel">Екип</div><div class="ibval">${team?.name||'—'}</div></div>
    </div>
    <div class="pricebox">
      <div style="font-size:13px;color:#888">Стойност на обекта</div>
      <div style="font-size:22px;font-weight:700;color:#d4a017">${Number(p.price).toLocaleString()} лв</div>
    </div>
    ${isBoss&&!p.approved?`<button onclick="approveProj()" class="bigbtn" style="background:#10b981;color:#fff">✔ Одобри офертата</button>`:''}
    ${p.approved?`<div style="text-align:center;font-size:12px;color:#10b981;margin-bottom:14px">✔ Офертата е одобрена</div>`:''}
    <div style="background:#161616;border:1px solid #222;border-radius:12px;padding:14px;margin-bottom:12px">

function renderMats(p){
  if(!p.materials||!p.materials.length) return '<div style="padding:14px;text-align:center;font-size:13px;color:#555">Няма материали</div>';
  return p.materials.map((m,i)=>`
    <div class="matrow" onclick="toggleMat(${i})">
      <div class="chk${m.done?' on':''}">${m.done?'✓':''}</div>
      <div style="flex:1;font-size:14px;color:${m.done?'#555':'#ccc'};text-decoration:${m.done?'line-through':'none'}">${m.name}</div>
      <div style="font-size:12px;color:#666;background:#1e1e1e;padding:2px 8px;border-radius:6px">${m.qty}</div>
    </div>`).join('');
}

function toggleMat(i){

function approveProj(){

// ── Photos ────────────────────────────────────────────────────────
function handlePhotos(input){
  const mode=input.dataset.mode||'new';
  const files=Array.from(input.files);
  if(!files.length)return;
  files.forEach(f=>{
    const reader=new FileReader();
    reader.onload=e=>{
      const data=e.target.result;
      if(mode==='new'){
        NP.push(data);renderNewPhotoGrid();
      } else {
        const p=DB.projects.find(x=>x.id===CUR.id);
        if(!p.photos)p.photos=[];
        p.photos.push(data);CUR=p;save();
        const g=document.getElementById('detail-photos');
        if(g){
          const img=document.createElement('img');
          img.className='pthumb';img.src=data;
          img.onclick=()=>openPhoto(data);
          g.appendChild(img);
          const empty=g.querySelector('div');
          if(empty)empty.remove();
        }
      }
    };
    reader.readAsDataURL(f);
  });
  input.value='';
}
function openPhoto(src){
  document.getElementById('povl-img').src=src;
  document.getElementById('povl').style.display='flex';
}
function renderNewPhotoGrid(){
  const g=document.getElementById('new-photo-grid');
  if(!g)return;
  g.innerHTML=NP.map((src,i)=>`<img class="pthumb" src="${src}" onclick="openPhoto('${src}')" />`).join('')
    +`<div class="padd" onclick="document.getElementById('photo-input').dataset.mode='new';document.getElementById('photo-input').click()"><span style="font-size:24px">+</span><span>Снимка</span></div>`;
}

// ── Calculator ────────────────────────────────────────────────────
function renderCalcCats(){
  const el=document.getElementById('calc-cats');if(!el)return;
  el.innerHTML=CALC_CATS.map(cat=>`
    <div class="calcsec">
      <div class="calchdr" onclick="toggleCat('${cat.id}')">
        <span style="font-size:13px;font-weight:600;color:#d4a017">${cat.name}</span>
        <span id="cat-arr-${cat.id}" style="color:#555;font-size:16px">${cat.open?'▲':'▼'}</span>
      </div>
      <div id="cat-body-${cat.id}" style="display:${cat.open?'block':'none'}">
        <div style="display:grid;grid-template-columns:1fr 70px 70px;gap:4px;padding:8px 14px 4px;font-size:10px;color:#555;text-transform:uppercase;letter-spacing:.05em">
          <div>Позиция</div><div>Кол.</div><div style="text-align:right">Сума</div>
        </div>
        ${cat.items.map((item,i)=>{
          const key=cat.id+'_'+i;
          const qty=(CALC[key]&&CALC[key].qty)||0;
          const sum=qty*item.price;
          return `<div class="calcrow">
            <div style="font-size:12px;color:#ccc;line-height:1.3">${item.name}<br><span style="font-size:10px;color:#555">${item.price} лв/${item.unit}</span></div>
            <input type="number" min="0" step="0.1" value="${qty||''}" placeholder="0"
              oninput="updateCalc('${key}',this.value,${item.price},'${item.unit}')"
              style="text-align:center"/>
            <div id="sum-${key}" style="text-align:right;font-size:13px;color:${sum>0?'#d4a017':'#555'};font-weight:${sum>0?'700':'400'}">${sum>0?sum.toLocaleString()+' лв':'—'}</div>
          </div>`;
        }).join('')}
        <div class="calctotal">
          <span style="font-size:12px;color:#888">${cat.name}</span>
          <span id="catsum-${cat.id}" style="font-weight:700;color:#d4a017;font-size:13px">${calcCatTotal(cat.id)} лв</span>
        </div>
      </div>
    </div>`).join('');
}
function toggleCat(id){
  const cat=CALC_CATS.find(c=>c.id===id);if(!cat)return;
  cat.open=!cat.open;
  document.getElementById('cat-body-'+id).style.display=cat.open?'block':'none';
  document.getElementById('cat-arr-'+id).textContent=cat.open?'▲':'▼';
}
function updateCalc(key,val,price,unit){
  const qty=parseFloat(val)||0;
  CALC[key]={qty,price,unit};
  const sum=qty*price;
  const el=document.getElementById('sum-'+key);
  if(el){el.textContent=sum>0?sum.toLocaleString()+' лв':'—';el.style.color=sum>0?'#d4a017':'#555';el.style.fontWeight=sum>0?'700':'400';}
  const catId=key.split('_')[0];
  const cel=document.getElementById('catsum-'+catId);
  if(cel)cel.textContent=calcCatTotal(catId)+' лв';
  const tot=calcGrandTotal();
  const tel=document.getElementById('calc-total-top');
  if(tel)tel.textContent=tot.toLocaleString()+' лв';
  const fp=document.getElementById('f-price');
  if(fp&&tot>0)fp.value=tot;
}
function calcCatTotal(catId){
  return Object.entries(CALC).filter(([k])=>k.startsWith(catId+'_')).reduce((s,[,v])=>s+(v.qty||0)*(v.price||0),0);
}
function calcGrandTotal(){
  return Object.values(CALC).reduce((s,v)=>s+(v.qty||0)*(v.price||0),0);
}
function getCalcItems(){
  const items=[];
  CALC_CATS.forEach(cat=>{
    cat.items.forEach((item,i)=>{
      const key=cat.id+'_'+i;
      const v=CALC[key];
      if(v&&v.qty>0)items.push({id:key,name:item.name,unit:item.unit,qty:v.qty,price:item.price});
    });
  });
  return items;
}

    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px">
      <div class="statcard" style="background:#1a1500;border-color:#3a2e00"><div style="font-size:11px;color:#888;margin-bottom:4px">Общо приходи</div><div style="font-size:20px;font-weight:700;color:#d4a017">${total.toLocaleString()} лв</div></div>
      <div class="statcard"><div style="font-size:11px;color:#888;margin-bottom:4px">Обекти</div><div style="font-size:20px;font-weight:700">${ps.length}</div></div>
    </div>
    ${pending>0?`<div class="warnbox"><div class="dot" style="background:#f59e0b"></div>${pending} оферт${pending===1?'а':'и'} чакат одобрение</div>`:''}
    <div style="font-size:11px;color:#555;letter-spacing:.1em;text-transform:uppercase;margin-bottom:10px">По статус</div>
    <div style="background:#161616;border:1px solid #222;border-radius:12px;overflow:hidden;margin-bottom:16px">
      ${Object.entries(STATUS).filter(([k])=>ps.some(p=>p.status===k)).map(([k,v],i,arr)=>`
        <div style="display:flex;align-items:center;gap:12px;padding:11px 14px;${i<arr.length-1?'border-bottom:1px solid #1e1e1e':''}">
          <div class="dot" style="background:${v.color}"></div>
          <div style="flex:1;font-size:13px;color:#ccc">${v.label}</div>
          <div style="font-size:13px;font-weight:700;color:${v.color}">${ps.filter(p=>p.status===k).length}</div>
        </div>`).join('')}
    </div>
    <div style="font-size:11px;color:#555;letter-spacing:.1em;text-transform:uppercase;margin-bottom:10px">По екипи</div>
    <div style="background:#161616;border:1px solid #222;border-radius:12px;overflow:hidden">
      ${TEAMS.filter(t=>t.role==='team').map((t,i,arr)=>{
        const cnt=ps.filter(p=>p.teamId===t.id).length;
        const sum=ps.filter(p=>p.teamId===t.id).reduce((s,p)=>s+Number(p.price),0);
        return `<div style="display:flex;align-items:center;padding:11px 14px;${i<arr.length-1?'border-bottom:1px solid #1e1e1e':''}">
          <div style="flex:1;font-size:13px;color:#ccc">${t.name}</div>
          <div style="font-size:12px;color:#666;margin-right:8px">${cnt} обекта</div>
          <div style="font-size:13px;font-weight:700;color:#d4a017">${sum.toLocaleString()} лв</div>
        </div>`;
      }).join('')}
    </div>`;
}

// ── Init ──────────────────────────────────────────────────────────
renderLogin();
</script>
</body>
</html>

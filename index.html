<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<meta name="theme-color" content="#0a0a0a"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<title>Ремонт Хаос — Тефтер</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:#0a0a0a;color:#fff;font-family:'Segoe UI',system-ui,sans-serif;min-height:100dvh;overscroll-behavior:none}
input,select,textarea,button{font-family:inherit}
input,select,textarea{background:#0f0f0f;border:1.5px solid #2a2a2a;border-radius:10px;color:#fff;font-size:14px;outline:none;padding:11px 14px;width:100%}
input::placeholder,textarea::placeholder{color:#444}
select option{background:#1a1a1a}
textarea{resize:vertical;min-height:60px}
button{cursor:pointer}
::-webkit-scrollbar{width:3px}::-webkit-scrollbar-thumb{background:#2a2a2a;border-radius:2px}
.screen{display:none;flex-direction:column;min-height:100dvh}
.screen.active{display:flex}
.topbar{background:#0f0f0f;border-bottom:1px solid #1e1e1e;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;flex-shrink:0}
.bottomnav{background:#0f0f0f;border-top:1px solid #1e1e1e;padding:10px 16px;display:flex;justify-content:space-around;align-items:center;flex-shrink:0;position:sticky;bottom:0}
.scrollarea{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.pad{padding:14px 16px;padding-bottom:20px}
.card{background:#161616;border:1px solid #222;border-radius:14px;padding:16px;margin-bottom:10px;cursor:pointer;transition:transform 0.1s}
.card:active{transform:scale(0.98)}
.pill{font-size:11px;font-weight:600;padding:4px 10px;border-radius:20px;white-space:nowrap}
.label{font-size:11px;color:#666;letter-spacing:.1em;text-transform:uppercase;margin-bottom:4px;margin-top:12px;display:block}
.label:first-child{margin-top:0}
.infogrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.infobox{background:#161616;border:1px solid #222;border-radius:10px;padding:10px 12px}
.infobox .iblabel{font-size:10px;color:#555;margin-bottom:3px}
.infobox .ibval{font-size:13px;color:#ccc;font-weight:600}
.matrow{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid #1e1e1e;cursor:pointer}
.matrow:last-child{border-bottom:none}
.checkbox{width:22px;height:22px;border-radius:6px;border:2px solid #333;background:transparent;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all 0.15s}
.checkbox.done{background:#10b981;border-color:#10b981}
.navbtn{background:none;border:none;color:#555;display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 16px;font-size:10px;font-weight:600}
.navbtn.active{color:#d4a017}
.fab{background:#d4a017;border:none;border-radius:50%;width:50px;height:50px;display:flex;align-items:center;justify-content:center;box-shadow:0 0 20px #d4a01744}
.statusbtn{padding:5px 10px;border-radius:8px;font-size:11px;font-weight:600;cursor:pointer;white-space:nowrap;flex-shrink:0;transition:all 0.15s}
.filterpill{padding:6px 12px;border-radius:20px;font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap;flex-shrink:0;border:1px solid #2a2a2a;background:transparent;color:#666;transition:all 0.15s}
.filterpill.active{border-color:#d4a017;background:#1a1500;color:#d4a017}
.scrollrow{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:14px}
.scrollrow::-webkit-scrollbar{display:none}
.back-btn{background:none;border:none;color:#888;padding:4px;display:flex;align-items:center;gap:6px;font-size:16px;font-weight:700;color:#fff}
.section-title{font-size:13px;color:#fff;font-weight:600;display:flex;align-items:center;gap:6px;margin-bottom:10px}
.outlinebtn{background:none;border:1px solid #333;border-radius:8px;color:#d4a017;font-size:12px;padding:4px 10px}
.bigbtn{width:100%;padding:14px;border:none;border-radius:12px;font-size:15px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px}
.matinput-row{display:flex;gap:8px;margin-bottom:8px}
.matinput-row input:first-child{flex:2}
.matinput-row input:last-child{flex:1}
.delbtn{background:none;border:none;color:#555;padding:0 4px;font-size:18px;line-height:1}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.fade{animation:fadeIn 0.2s ease}
.empty{text-align:center;color:#555;padding:40px 0;font-size:14px}
.warn-box{background:#1c1400;border:1px solid #f59e0b44;border-radius:12px;padding:12px 14px;margin-bottom:14px;display:flex;align-items:center;gap:10px;font-size:13px;color:#f59e0b}
.dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.price-box{background:#1a1500;border:1px solid #3a2e00;border-radius:12px;padding:14px 16px;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center}
.special-box{background:#16100a;border:1px solid #3a2000;border-radius:12px;padding:14px;margin-bottom:12px}
.stat-card{background:#161616;border:1px solid #222;border-radius:12px;padding:14px}
.stat-card .slabel{font-size:11px;color:#888;margin-bottom:4px}
.stat-card .sval{font-size:20px;font-weight:700}
</style>
</head>
<body>

<!-- ═══════════════════════════════════ LOGIN ═══════════════════ -->
<div id="screen-login" class="screen active" style="align-items:center;justify-content:center;padding:24px;background:#0f0f0f">
  <div style="text-align:center;margin-bottom:32px">
    <div style="font-size:12px;letter-spacing:.2em;color:#666;text-transform:uppercase;margin-bottom:8px">Ремонт Хаос</div>
    <div style="font-size:28px;font-weight:700;letter-spacing:-.5px">Работен тефтер</div>
    <div style="font-size:13px;color:#555;margin-top:6px">Изберете екип и въведете парола</div>
  </div>
  <div style="width:100%;max-width:340px">
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px" id="team-grid"></div>
    <div id="pw-block" style="display:none" class="fade">
      <input type="password" id="pw-input" placeholder="Парола" style="margin-bottom:8px" onkeydown="if(event.key==='Enter')doLogin()"/>
      <div id="pw-err" style="color:#fc8181;font-size:12px;text-align:center;margin-bottom:8px;display:none">Грешна парола</div>
      <button onclick="doLogin()" style="width:100%;padding:14px;background:#d4a017;border:none;border-radius:10px;color:#000;font-size:15px;font-weight:700">Влез →</button>
    </div>
  </div>
</div>

<!-- ═══════════════════════════════════ MAIN ═══════════════════ -->
<div id="screen-main" class="screen">
  <div class="topbar">
    <div>
      <div style="font-size:11px;color:#555;letter-spacing:.15em;text-transform:uppercase">Ремонт Хаос</div>
      <div style="font-size:16px;font-weight:700" id="main-username"></div>
    </div>
    <button onclick="doLogout()" style="background:none;border:1px solid #2a2a2a;border-radius:8px;color:#666;padding:6px 10px;display:flex;align-items:center;gap:6px;font-size:12px">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
      Изход
    </button>
  </div>

  <div class="scrollarea" id="main-content">
    <!-- Projects tab -->
    <div id="tab-projects" class="pad">
      <div class="scrollrow" id="filter-row"></div>
      <div id="project-list"></div>
    </div>
    <!-- Stats tab (boss only) -->
    <div id="tab-stats" class="pad" style="display:none"></div>
  </div>

  <div class="bottomnav" id="bottomnav"></div>
</div>

<!-- ═══════════════════════════════════ NEW PROJECT ═══════════════ -->
<div id="screen-new" class="screen">
  <div class="topbar">
    <button class="back-btn" onclick="showMain()">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#888" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
      Нов обект
    </button>
  </div>
  <div class="scrollarea pad" style="padding-bottom:90px" id="new-form-body"></div>
  <div style="position:sticky;bottom:0;padding:12px 16px;background:#0a0a0a">
    <button onclick="saveNew()" class="bigbtn" style="background:#d4a017;color:#000">Запази обекта</button>
  </div>
</div>

<!-- ═══════════════════════════════════ DETAIL ════════════════════ -->
<div id="screen-detail" class="screen">
  <div class="topbar" id="detail-topbar"></div>
  <div class="scrollrow" id="detail-status-row" style="padding:10px 16px 6px;background:#0f0f0f;border-bottom:1px solid #1e1e1e;flex-shrink:0"></div>
  <div class="scrollarea pad" style="padding-bottom:30px" id="detail-body"></div>
</div>

<script>
// ── Data ──────────────────────────────────────────────────────────
const TEAMS = [
  {id:'boss',  name:'Шеф',    password:'boss123', role:'boss'},
  {id:'ekip1', name:'Екип 1', password:'ekip1',   role:'team'},
  {id:'ekip2', name:'Екип 2', password:'ekip2',   role:'team'},
  {id:'ekip3', name:'Екип 3', password:'ekip3',   role:'team'},
];
const STATUS = {
  pregled:    {label:'Оглед',     color:'#6366f1'},
  oferта:     {label:'Оферта',    color:'#f59e0b'},
  odobrena:   {label:'Одобрена',  color:'#10b981'},
  v_rabota:   {label:'В работа',  color:'#3b82f6'},
  zavarshen:  {label:'Завършен',  color:'#8b5cf6'},
  platen:     {label:'Платен',    color:'#059669'},
};
const STORE = 'rh_v1';
let DB = {projects:[]};
let USER = null;
let FILTER = 'all';
let CURRENT_PROJECT = null;
let NEW_MATS = [];

function load(){try{const r=localStorage.getItem(STORE);if(r)DB=JSON.parse(r);}catch(e){}}
function save(){try{localStorage.setItem(STORE,JSON.stringify(DB));}catch(e){}}
function uid(){return 'p'+Date.now()+Math.random().toString(36).slice(2,6)}

// Demo data
const DEMO = [
  {id:'p1',teamId:'ekip1',client:'Иван Петров',phone:'0888 123 456',address:'ул. Роза 12, Русе',dateVisit:'2026-03-18',deadline:'2026-04-10',status:'v_rabota',price:2450,task:'Ремонт баня — смяна на теракот, боядисване',materials:[{name:'Теракот 60x60 бял',qty:'22 м²',done:true},{name:'Фугираща маса',qty:'5 кг',done:true},{name:'Лепило за плочки',qty:'3 торби',done:false},{name:'Боя за стени',qty:'10 л',done:false}],notes:'Клиентът иска запазване на стария санитарен фаянс.',approved:true},
  {id:'p2',teamId:'ekip2',client:'Мария Иванова',phone:'0877 654 321',address:'бул. Цар Освободител 44, Русе',dateVisit:'2026-03-20',deadline:'2026-04-25',status:'oferта',price:1800,task:'Боядисване на апартамент — 3 стаи',materials:[{name:'Интериорна боя бяла',qty:'25 л',done:false},{name:'Грунд',qty:'5 л',done:false}],notes:'',approved:false},
  {id:'p3',teamId:'ekip1',client:'Георги Стоянов',phone:'0899 111 222',address:'ул. Баба Тонка 8, Русе',dateVisit:'2026-03-15',deadline:'2026-03-30',status:'platen',price:980,task:'Смяна на подова настилка — ламинат',materials:[{name:'Ламинат дъб',qty:'28 м²',done:true},{name:'Подложка 3мм',qty:'28 м²',done:true}],notes:'',approved:true},
];

load();
if(!DB.projects||DB.projects.length===0){DB.projects=DEMO;save();}

// ── Screens ───────────────────────────────────────────────────────
function showScreen(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById('screen-'+id).classList.add('active');
  window.scrollTo(0,0);
}
function showMain(){showScreen('main');renderProjectList();}

// ── Login ─────────────────────────────────────────────────────────
let selectedTeamId = null;

function renderLogin(){
  const g = document.getElementById('team-grid');
  g.innerHTML = TEAMS.map(t=>`
    <button id="tb-${t.id}" onclick="selectTeam('${t.id}')"
      style="padding:14px 10px;border-radius:12px;border:1.5px solid #2a2a2a;background:#161616;color:#888;font-size:13px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:6px">
      ${t.role==='boss'?'★':''} ${t.name}
    </button>`).join('');
}

function selectTeam(id){
  selectedTeamId = id;
  document.querySelectorAll('#team-grid button').forEach(b=>{
    b.style.border='1.5px solid #2a2a2a';b.style.background='#161616';b.style.color='#888';
  });
  const b = document.getElementById('tb-'+id);
  b.style.border='2px solid #d4a017';b.style.background='#1a1500';b.style.color='#d4a017';
  document.getElementById('pw-block').style.display='block';
  document.getElementById('pw-input').focus();
}

function doLogin(){
  const team = TEAMS.find(t=>t.id===selectedTeamId);
  const pw = document.getElementById('pw-input').value;
  const err = document.getElementById('pw-err');
  if(!team) return;
  if(team.password===pw){
    err.style.display='none';
    USER = team;
    document.getElementById('pw-input').value='';
    renderMain();
    showScreen('main');
  } else {
    err.style.display='block';
  }
}

function doLogout(){
  USER=null;selectedTeamId=null;FILTER='all';
  document.getElementById('pw-block').style.display='none';
  document.getElementById('pw-input').value='';
  document.querySelectorAll('#team-grid button').forEach(b=>{
    b.style.border='1.5px solid #2a2a2a';b.style.background='#161616';b.style.color='#888';
  });
  showScreen('login');
}

// ── Main ──────────────────────────────────────────────────────────
function renderMain(){
  document.getElementById('main-username').textContent = USER.name;
  renderBottomNav();
  renderFilterRow();
  renderProjectList();
}

function renderBottomNav(){
  const nav = document.getElementById('bottomnav');
  const isBoss = USER.role==='boss';
  nav.innerHTML = `
    <button class="navbtn active" id="nav-projects" onclick="switchTab('projects')">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
      Обекти
    </button>
    <button class="fab" onclick="showNewProject()">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2.2" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
    </button>
    ${isBoss?`<button class="navbtn" id="nav-stats" onclick="switchTab('stats')">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
      Статистики
    </button>`:`<button class="navbtn" onclick="">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      Профил
    </button>`}`;
}

function switchTab(t){
  document.getElementById('tab-projects').style.display = t==='projects'?'block':'none';
  document.getElementById('tab-stats').style.display = t==='stats'?'block':'none';
  ['projects','stats'].forEach(x=>{
    const b=document.getElementById('nav-'+x);
    if(b) b.className='navbtn'+(t===x?' active':'');
  });
  if(t==='stats') renderStats();
}

function renderFilterRow(){
  const row = document.getElementById('filter-row');
  const filters = [{k:'all',l:'Всички'},...Object.entries(STATUS).map(([k,v])=>({k,l:v.label}))];
  row.innerHTML = filters.map(f=>`
    <button class="filterpill${f.k===FILTER?' active':''}" onclick="setFilter('${f.k}')">${f.l}</button>`).join('');
}

function setFilter(f){FILTER=f;renderFilterRow();renderProjectList();}

function myProjects(){
  return USER.role==='boss' ? DB.projects : DB.projects.filter(p=>p.teamId===USER.id);
}

function renderProjectList(){
  const list = document.getElementById('project-list');
  const ps = FILTER==='all' ? myProjects() : myProjects().filter(p=>p.status===FILTER);
  if(!ps.length){list.innerHTML='<div class="empty">Няма обекти</div>';return;}
  list.innerHTML = ps.map(p=>{
    const st=STATUS[p.status]||STATUS.pregled;
    const team=TEAMS.find(t=>t.id===p.teamId);
    return `<div class="card" onclick="openProject('${p.id}')">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px">
        <div>
          <div style="font-weight:700;font-size:15px;margin-bottom:2px">${p.client}</div>
          <div style="font-size:12px;color:#555">${p.address.split(',')[0]}</div>
        </div>
        <span class="pill" style="background:${st.color}22;color:${st.color};border:1px solid ${st.color}44">${st.label}</span>
      </div>
      <div style="font-size:12px;color:#666;margin-bottom:10px;line-height:1.4;border-left:2px solid #2a2a2a;padding-left:8px">${p.task}</div>
      <div style="display:flex;justify-content:space-between;align-items:center">
        <div style="font-size:12px;color:#555">Срок: ${p.deadline||'—'}</div>
        <div style="display:flex;align-items:center;gap:8px">
          ${USER.role==='boss'?`<span style="font-size:11px;color:#888;background:#1e1e1e;padding:2px 8px;border-radius:8px">${team?.name||''}</span>`:''}
          <span style="font-weight:700;color:#d4a017;font-size:15px">${Number(p.price).toLocaleString()} лв</span>
        </div>
      </div>
      ${!p.approved?'<div style="margin-top:8px;font-size:11px;color:#f59e0b;display:flex;align-items:center;gap:4px"><span style="width:6px;height:6px;border-radius:50%;background:#f59e0b;display:inline-block"></span>Чака одобрение</div>':''}
    </div>`;
  }).join('');
}

// ── Detail ────────────────────────────────────────────────────────
function openProject(id){
  CURRENT_PROJECT = DB.projects.find(p=>p.id===id);
  if(!CURRENT_PROJECT) return;
  renderDetail();
  showScreen('detail');
}

function renderDetail(){
  const p = CURRENT_PROJECT;
  const st = STATUS[p.status]||STATUS.pregled;
  const team = TEAMS.find(t=>t.id===p.teamId);
  const isBoss = USER.role==='boss';

  // Topbar
  document.getElementById('detail-topbar').innerHTML=`
    <button class="back-btn" onclick="showMain()" style="color:#fff">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#888" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
      ${p.client}
    </button>
    <span class="pill" style="background:${st.color}22;color:${st.color};border:1px solid ${st.color}44">${st.label}</span>`;

  // Status row
  document.getElementById('detail-status-row').innerHTML=Object.entries(STATUS).map(([k,v])=>`
    <button class="statusbtn" onclick="changeStatus('${k}')"
      style="border:1px solid ${p.status===k?v.color:'#2a2a2a'};background:${p.status===k?v.color+'22':'transparent'};color:${p.status===k?v.color:'#555'}">
      ${v.label}
    </button>`).join('');

  // Body
  const doneMats = p.materials.filter(m=>m.done).length;
  document.getElementById('detail-body').innerHTML=`
    <div class="infogrid">
      <div class="infobox"><div class="iblabel">Телефон</div><div class="ibval">${p.phone||'—'}</div></div>
      <div class="infobox"><div class="iblabel">Дата оглед</div><div class="ibval">${p.dateVisit||'—'}</div></div>
      <div class="infobox"><div class="iblabel">Краен срок</div><div class="ibval">${p.deadline||'—'}</div></div>
      <div class="infobox"><div class="iblabel">Екип</div><div class="ibval">${team?.name||'—'}</div></div>
    </div>

    <div class="price-box">
      <div style="font-size:13px;color:#888">Стойност на обекта</div>
      <div style="font-size:22px;font-weight:700;color:#d4a017">${Number(p.price).toLocaleString()} лв</div>
    </div>

    ${isBoss&&!p.approved?`<button onclick="approveProject()" class="bigbtn" style="background:#10b981;color:#fff;margin-bottom:14px">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
      Одобри офертата
    </button>`:''}
    ${p.approved?`<div style="text-align:center;font-size:12px;color:#10b981;margin-bottom:14px;display:flex;align-items:center;justify-content:center;gap:4px">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
      Офертата е одобрена
    </div>`:''}

    <div style="background:#161616;border:1px solid #222;border-radius:12px;padding:14px;margin-bottom:12px">
      <div style="font-size:11px;color:#555;text-transform:uppercase;letter-spacing:.1em;margin-bottom:6px">Задача</div>
      <div style="font-size:14px;color:#ccc;line-height:1.5">${p.task}</div>
    </div>

    ${p.notes?`<div class="special-box">
      <div style="font-size:11px;color:#c47a2a;text-transform:uppercase;letter-spacing:.1em;margin-bottom:6px">⚠ Специално задание</div>
      <div style="font-size:14px;color:#dbb080;line-height:1.5">${p.notes}</div>
    </div>`:''}

    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
      <div class="section-title">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#d4a017" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><line x1="16.5" y1="9.4" x2="7.5" y2="4.21"/><path d="M21 16V8a2 2 0 00-1-1.73l-7-4a2 2 0 00-2 0l-7 4A2 2 0 002 8v8a2 2 0 001 1.73l7 4a2 2 0 002 0l7-4A2 2 0 0021 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg>
        Материали
      </div>
      <div style="font-size:11px;color:#555">${doneMats}/${p.materials.length} набавени</div>
    </div>
    <div style="background:#161616;border:1px solid #222;border-radius:12px;overflow:hidden;margin-bottom:14px" id="mat-list">
      ${renderMaterials(p)}
    </div>

    <button onclick="shareRequest()" class="bigbtn" style="background:#1a2535;border:1.5px solid #253550;color:#60a5fa;margin-bottom:10px">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
      Изпрати заявка за материали
    </button>
  `;
}

function renderMaterials(p){
  return p.materials.map((m,i)=>`
    <div class="matrow" onclick="toggleMat(${i})">
      <div class="checkbox${m.done?' done':''}">
        ${m.done?`<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>`:''}
      </div>
      <div style="flex:1;font-size:14px;color:${m.done?'#555':'#ccc'};text-decoration:${m.done?'line-through':'none'}">${m.name}</div>
      <div style="font-size:12px;color:#666;background:#1e1e1e;padding:2px 8px;border-radius:6px">${m.qty}</div>
    </div>`).join('');
}

function toggleMat(i){
  const p = DB.projects.find(x=>x.id===CURRENT_PROJECT.id);
  p.materials[i].done = !p.materials[i].done;
  CURRENT_PROJECT = p;
  save();
  document.getElementById('mat-list').innerHTML = renderMaterials(p);
  // refresh done count
  const done = p.materials.filter(m=>m.done).length;
  const el = document.querySelector('#detail-body .section-title + div');
  if(el) el.textContent = `${done}/${p.materials.length} набавени`;
}

function changeStatus(s){
  const p = DB.projects.find(x=>x.id===CURRENT_PROJECT.id);
  p.status = s;
  CURRENT_PROJECT = p;
  save();
  renderDetail();
}

function approveProject(){
  const p = DB.projects.find(x=>x.id===CURRENT_PROJECT.id);
  p.approved = true;
  p.status = 'odobrena';
  CURRENT_PROJECT = p;
  save();
  renderDetail();
}

function shareRequest(){
  const p = CURRENT_PROJECT;
  const text = `📋 ЗАЯВКА ЗА МАТЕРИАЛИ\n🏠 Обект: ${p.address}\n👤 ${p.client} — ${p.phone||''}\n\n${p.materials.map(m=>`• ${m.name} — ${m.qty}`).join('\n')}\n\n📌 ${p.task}${p.notes?'\n\n⚠ '+p.notes:''}`;
  if(navigator.share){ navigator.share({title:'Заявка материали',text}); }
  else if(navigator.clipboard){ navigator.clipboard.writeText(text).then(()=>alert('Копирано! Постави в Viber/WhatsApp')); }
  else { alert(text); }
}

// ── New Project ───────────────────────────────────────────────────
function showNewProject(){
  NEW_MATS = [{name:'',qty:'',done:false}];
  renderNewForm();
  showScreen('new');
}

function renderNewForm(){
  const today = new Date().toISOString().split('T')[0];
  const statusOpts = Object.entries(STATUS).map(([k,v])=>`<option value="${k}">${v.label}</option>`).join('');
  const teamOpts = USER.role==='boss' ? `
    <label class="label">Екип</label>
    <select id="f-team" style="margin-bottom:0">
      ${TEAMS.filter(t=>t.role==='team').map(t=>`<option value="${t.id}">${t.name}</option>`).join('')}
    </select>` : '';

  document.getElementById('new-form-body').innerHTML=`
    <label class="label">Клиент</label>
    <input id="f-client" placeholder="Три имена" style="margin-bottom:0"/>
    <label class="label">Телефон</label>
    <input id="f-phone" type="tel" placeholder="0888 000 000" style="margin-bottom:0"/>
    <label class="label">Адрес на обекта</label>
    <input id="f-address" placeholder="ул., номер, град" style="margin-bottom:0"/>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px">
      <div><label class="label" style="margin-top:0">Дата оглед</label><input id="f-date" type="date" value="${today}" style="margin-bottom:0"/></div>
      <div><label class="label" style="margin-top:0">Краен срок</label><input id="f-deadline" type="date" style="margin-bottom:0"/></div>
    </div>
    <label class="label">Статус</label>
    <select id="f-status" style="margin-bottom:0">${statusOpts}</select>
    <label class="label">Цена (лв)</label>
    <input id="f-price" type="number" placeholder="0" style="margin-bottom:0"/>
    ${teamOpts}
    <label class="label">Описание на задачата</label>
    <textarea id="f-task" placeholder="Какво се ремонтира..."></textarea>
    <label class="label">Специално задание / бележки</label>
    <textarea id="f-notes" placeholder="Особени изисквания на клиента..."></textarea>
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
      <label class="label" style="margin:0">Материали</label>
      <button class="outlinebtn" onclick="addMatField()">+ Добави</button>
    </div>
    <div id="mat-fields"></div>
  `;
  renderMatFields();
}

function renderMatFields(){
  const c = document.getElementById('mat-fields');
  c.innerHTML = NEW_MATS.map((m,i)=>`
    <div class="matinput-row">
      <input placeholder="Материал" value="${m.name}" oninput="NEW_MATS[${i}].name=this.value"/>
      <input placeholder="Кол." value="${m.qty}" oninput="NEW_MATS[${i}].qty=this.value"/>
      <button class="delbtn" onclick="removeMat(${i})">×</button>
    </div>`).join('');
}
function addMatField(){NEW_MATS.push({name:'',qty:'',done:false});renderMatFields();}
function removeMat(i){NEW_MATS.splice(i,1);renderMatFields();}

function saveNew(){
  const client = document.getElementById('f-client')?.value?.trim();
  const address = document.getElementById('f-address')?.value?.trim();
  if(!client||!address){alert('Попълни поне клиент и адрес');return;}
  const teamId = USER.role==='boss' ? (document.getElementById('f-team')?.value||'ekip1') : USER.id;
  const proj = {
    id: uid(), teamId,
    client, phone: document.getElementById('f-phone')?.value||'',
    address, dateVisit: document.getElementById('f-date')?.value||'',
    deadline: document.getElementById('f-deadline')?.value||'',
    status: document.getElementById('f-status')?.value||'pregled',
    price: Number(document.getElementById('f-price')?.value)||0,
    task: document.getElementById('f-task')?.value||'',
    notes: document.getElementById('f-notes')?.value||'',
    materials: NEW_MATS.filter(m=>m.name),
    approved: false,
  };
  DB.projects.push(proj);
  save();
  showMain();
}

// ── Stats ─────────────────────────────────────────────────────────
function renderStats(){
  const ps = DB.projects;
  const total = ps.reduce((s,p)=>s+Number(p.price),0);
  const pending = ps.filter(p=>!p.approved).length;
  const byStatus = Object.entries(STATUS).filter(([k])=>ps.some(p=>p.status===k));

  document.getElementById('tab-stats').innerHTML=`
    <div style="font-size:11px;color:#555;letter-spacing:.15em;text-transform:uppercase;margin-bottom:10px">Обобщение</div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px">
      <div class="stat-card" style="background:#1a1500;border-color:#3a2e00">
        <div class="slabel">Общо приходи</div>
        <div class="sval" style="color:#d4a017">${total.toLocaleString()} лв</div>
      </div>
      <div class="stat-card">
        <div class="slabel">Обекти</div>
        <div class="sval" style="color:#fff">${ps.length}</div>
      </div>
    </div>
    ${pending>0?`<div class="warn-box"><div class="dot" style="background:#f59e0b"></div>${pending} оферт${pending===1?'а':'и'} чакат одобрение</div>`:''}
    <div style="font-size:11px;color:#555;letter-spacing:.1em;text-transform:uppercase;margin-bottom:10px">По статус</div>
    <div style="background:#161616;border:1px solid #222;border-radius:12px;overflow:hidden;margin-bottom:16px">
      ${byStatus.map(([k,v],i)=>`
        <div style="display:flex;align-items:center;gap:12px;padding:11px 14px;${i<byStatus.length-1?'border-bottom:1px solid #1e1e1e':''}">
          <div class="dot" style="background:${v.color}"></div>
          <div style="flex:1;font-size:13px;color:#ccc">${v.label}</div>
          <div style="font-size:13px;font-weight:700;color:${v.color}">${ps.filter(p=>p.status===k).length}</div>
        </div>`).join('')}
    </div>
    <div style="font-size:11px;color:#555;letter-spacing:.1em;text-transform:uppercase;margin-bottom:10px">По екипи</div>
    <div style="background:#161616;border:1px solid #222;border-radius:12px;overflow:hidden">
      ${TEAMS.filter(t=>t.role==='team').map((t,i,arr)=>{
        const cnt=ps.filter(p=>p.teamId===t.id).length;
        const sum=ps.filter(p=>p.teamId===t.id).reduce((s,p)=>s+Number(p.price),0);
        return `<div style="display:flex;align-items:center;gap:12px;padding:11px 14px;${i<arr.length-1?'border-bottom:1px solid #1e1e1e':''}">
          <div style="flex:1;font-size:13px;color:#ccc">${t.name}</div>
          <div style="font-size:12px;color:#666;margin-right:4px">${cnt} обекта</div>
          <div style="font-size:13px;font-weight:700;color:#d4a017">${sum.toLocaleString()} лв</div>
        </div>`;
      }).join('')}
    </div>
  `;
}

// ── Init ──────────────────────────────────────────────────────────
renderLogin();
</script>
